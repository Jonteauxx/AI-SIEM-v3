# AI-SIEM v3 - Docker Compose Configuration
# Multi-container setup with all required services

services:
  # ==============================================================================
  # PostgreSQL Database (Production)
  # ==============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: siem-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-soc_agent}
      - POSTGRES_USER=${POSTGRES_USER:-soc_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_admin} -d ${POSTGRES_DB:-soc_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==============================================================================
  # Redis - Message Broker & Result Backend for Celery
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: siem-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==============================================================================
  # SIEM API Service - Main Application
  # ==============================================================================
  siem-api:
    image: soc-agent-siem-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siem-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8000"
      - "${LISTEN_PORT:-5047}:5046"
    environment:
      # Database - PostgreSQL (production)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-soc_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-soc_agent}
      # Fallback to SQLite for local development
      - DB_NAME=/app/data/ai_agent_logs.db
      # Elasticsearch/OpenSearch
      - ES_HOSTS=http://opensearch:9200
      - ES_INDEX=${ES_INDEX:-ai-analyzed-logs}
      # Ollama LLM
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral:7b}
      # Network
      - HOST_IP=0.0.0.0
      - API_PORT=8000
      - LISTEN_PORT=5046
      # Processing
      - BATCH_SIZE=${BATCH_SIZE:-5}
      - SLEEP_WHEN_EMPTY=${SLEEP_WHEN_EMPTY:-3}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      # Security - Authentication
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - API_KEY=${API_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      - CORS_ALLOW_ALL=${CORS_ALLOW_ALL:-false}
      # Data Retention
      - RETENTION_ENABLED=${RETENTION_ENABLED:-true}
      - RETENTION_DAYS=${RETENTION_DAYS:-90}
      - RETENTION_CHECK_HOURS=${RETENTION_CHECK_HOURS:-24}
      # Alerting
      - ALERTING_ENABLED=${ALERTING_ENABLED:-false}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_EMAIL_ENABLED=${ALERT_EMAIL_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_SEVERITY_THRESHOLD=${ALERT_SEVERITY_THRESHOLD:-High}
      # Celery / Redis
      - CELERY_ENABLED=${CELERY_ENABLED:-true}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
    volumes:
      - siem-data:/app/data
      - siem-logs:/app/logs
      - ./templates:/app/templates:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==============================================================================
  # Celery Worker - Background Task Processing
  # ==============================================================================
  celery-worker:
    image: soc-agent-siem-api:latest
    container_name: siem-celery-worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info -Q default,log_analysis,log_analysis_priority,maintenance,retention --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      - DB_NAME=/app/data/ai_agent_logs.db
      - DATABASE_URL=postgresql://${POSTGRES_USER:-soc_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-soc_agent}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral:7b}
      - ES_HOSTS=http://opensearch:9200
      - ES_INDEX=${ES_INDEX:-ai-analyzed-logs}
    volumes:
      - siem-data:/app/data
      - siem-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - siem-network

  # ==============================================================================
  # Celery Beat - Periodic Task Scheduler
  # ==============================================================================
  celery-beat:
    image: soc-agent-siem-api:latest
    container_name: siem-celery-beat
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info --schedule=/app/data/celerybeat-schedule
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - siem-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - siem-network

  # ==============================================================================
  # Flower - Celery Monitoring Dashboard
  # ==============================================================================
  flower:
    image: soc-agent-siem-api:latest
    container_name: siem-flower
    restart: unless-stopped
    command: celery -A celery_app flower --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - siem-network

  # ==============================================================================
  # Ollama LLM Service
  # ==============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: siem-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - siem-network
    # GPU support (uncomment if available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ==============================================================================
  # OpenSearch Service (Elasticsearch alternative)
  # ==============================================================================
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: siem-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9201}:9200"
      # Port 9600 is for internal OpenSearch performance analyzer
      # - "9601:9600"
    networks:
      - siem-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'cluster_name'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==============================================================================
  # OpenSearch Dashboards (Kibana alternative)
  # ==============================================================================
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: siem-dashboards
    restart: unless-stopped
    ports:
      - "${DASHBOARDS_PORT:-5601}:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - siem-network

# ==============================================================================
# Networks
# ==============================================================================
networks:
  siem-network:
    driver: bridge
    name: siem-network

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres-data:
    name: siem-postgres-data
  siem-data:
    name: siem-data
  siem-logs:
    name: siem-logs
  ollama-data:
    name: ollama-data
  redis-data:
    name: siem-redis-data
  opensearch-data:
    name: opensearch-data
