# Grafana Dashboard Provisioning Configuration
apiVersion: 1

providers:
  - name: 'AI-SIEM Dashboards'
    orgId: 1
    folder: 'AI-SIEM'
    folderUid: 'siem'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
