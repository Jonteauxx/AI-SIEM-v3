# Prometheus Configuration for AI-SIEM
# Scrape configuration for metrics collection

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  # Attach labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager)
  external_labels:
    monitor: 'ai-siem-monitor'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files (for recording rules and alerts)
rule_files:
  # - "alert_rules.yml"
  # - "recording_rules.yml"

# Scrape configuration
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # AI-SIEM API metrics
  - job_name: 'siem-api'
    static_configs:
      - targets: ['siem-api:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # OpenSearch metrics (if exporter is configured)
  # - job_name: 'opensearch'
  #   static_configs:
  #     - targets: ['opensearch:9200']

  # Docker container metrics (requires cAdvisor)
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']

  # Node metrics (requires node_exporter)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
