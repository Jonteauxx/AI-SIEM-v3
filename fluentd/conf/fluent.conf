# FluentD Configuration for AI-SIEM
# Receives logs from various sources and forwards to SIEM

# ==============================================================================
# Input: TCP/UDP for syslog-style logs
# ==============================================================================
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# ==============================================================================
# Input: Tail file logs (example)
# ==============================================================================
# <source>
#   @type tail
#   path /var/log/syslog
#   pos_file /fluentd/log/syslog.pos
#   tag syslog
#   <parse>
#     @type syslog
#   </parse>
# </source>

# ==============================================================================
# Input: HTTP endpoint for REST API logs
# ==============================================================================
<source>
  @type http
  port 9880
  bind 0.0.0.0
</source>

# ==============================================================================
# Filter: Add metadata
# ==============================================================================
<filter **>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    timestamp ${time}
  </record>
</filter>

# ==============================================================================
# Output: Forward to SIEM API
# ==============================================================================
<match **>
  @type forward
  send_timeout 60s
  recover_wait 10s
  hard_timeout 60s

  <server>
    name siem-api
    host siem-api
    port 5046
    weight 60
  </server>

  <buffer>
    @type file
    path /fluentd/log/buffer
    flush_mode interval
    flush_interval 5s
    chunk_limit_size 5m
    retry_max_interval 30s
    retry_forever false
    retry_max_times 10
  </buffer>
</match>

# ==============================================================================
# Debug: Output to stdout (development)
# ==============================================================================
# <match **>
#   @type stdout
# </match>
